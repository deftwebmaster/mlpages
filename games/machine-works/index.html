<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover" />
  <title>Machine Works | Factory Automation Browser Game</title>
  <meta name="description" content="Play Machine Works, a static browser factory game about restoring abandoned production lines, routing resources, and rebuilding machines efficiently.">
  <link rel="canonical" href="https://mattlivingston.com/games/machine-works/">
  <meta property="og:type" content="website">
  <meta property="og:url" content="https://mattlivingston.com/games/machine-works/">
  <meta property="og:title" content="Machine Works | Factory Automation Browser Game">
  <meta property="og:description" content="Play Machine Works, a static browser factory game about restoring abandoned production lines, routing resources, and rebuilding machines efficiently.">
  <meta property="og:image" content="https://mattlivingston.com/assets/card.png">
  <meta property="og:image:alt" content="Machine Works | Factory Automation Browser Game preview image">

<meta name="twitter:card" content="summary_large_image">
  <meta name="twitter:url" content="https://mattlivingston.com/games/machine-works/">
  <meta name="twitter:title" content="Machine Works | Factory Automation Browser Game">
  <meta name="twitter:description" content="Play Machine Works, a static browser factory game about restoring abandoned production lines, routing resources, and rebuilding machines efficiently.">
  <meta name="twitter:image" content="https://mattlivingston.com/assets/card.png">
<meta name="theme-color" content="#15171a" />
  <link rel="manifest" href="manifest.json" />
  <link rel="icon" href="assets/icons/icon.svg" type="image/svg+xml" />
  <link rel="apple-touch-icon" href="assets/icons/icon.svg" />
  <link rel="stylesheet" href="assets/css/main.css" />
</head>
<body>
  <div id="app">
    <canvas id="game-canvas"></canvas>

    <header id="top-bar">
      <span id="factory-name">Loading…</span>
      <span id="milestone-badge">Milestone 5 — Analysis &amp; Blueprints</span>
      <div class="top-bar-actions">
        <button id="btn-pause" title="Pause simulation">&#10074;&#10074;</button>
        <button id="btn-analysis" title="Enter Analysis Mode">&#128202;</button>
        <button id="btn-blueprints" title="Blueprints">&#128190;</button>
        <button id="btn-settings" disabled title="Coming soon">&#9881;</button>
      </div>
    </header>

    <div id="hud-bar">
      <span id="power-readout" class="hud-pill">⚡ 0/0 kW</span>
      <span id="objective-readout" class="hud-pill">Loading…</span>
      <span id="session-stats" class="hud-pill hidden"></span>
    </div>

    <div id="blueprint-panel" class="hidden">
      <div class="panel-header">
        <span>Blueprints</span>
        <button id="btn-close-blueprints" class="panel-close">&times;</button>
      </div>
      <div class="blueprint-save-row">
        <input id="blueprint-name-input" type="text" placeholder="Layout name" maxlength="40" />
        <button id="btn-save-blueprint">Save Current</button>
      </div>
      <div id="blueprint-list"></div>
    </div>

    <footer id="bottom-toolbar">
      <button data-tool="none" class="active">Select</button>
      <button data-tool="conveyor">Conveyor</button>
      <button data-tool="mining_drill">Mining Drill</button>
      <button data-tool="smelter">Smelter</button>
      <button data-tool="coal_generator">Coal Generator</button>
      <button data-tool="storage_bin">Storage Bin</button>
      <button data-tool="sink">Sink</button>
      <div class="toolbar-divider"></div>
      <button id="btn-rotate">Rotate &#8635;</button>
      <div class="toolbar-divider"></div>
      <button id="btn-undo" disabled>Undo</button>
      <button id="btn-redo" disabled>Redo</button>
    </footer>
  </div>

  <script>window.__MW_DISABLE_SW__ = new URLSearchParams(location.search).has('nosw');</script>
  <script type="module" src="src/game.js"></script>
</body>
</html>
