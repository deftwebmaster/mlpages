<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />

  <title>Coming Soon</title>
  <meta
    name="description"
    content="Something new is on the way. Check back soon."
  />

  <style>
    :root {
      --background: #070a12;
      --surface: rgba(255, 255, 255, 0.06);
      --border: rgba(255, 255, 255, 0.12);
      --text: #f7f8fc;
      --muted: #a7afc0;
      --cyan: #00e5ff;
      --violet: #8b5cf6;
    }

    * {
      box-sizing: border-box;
    }

    html {
      color-scheme: dark;
    }

    body {
      min-height: 100vh;
      margin: 0;
      display: grid;
      place-items: center;
      overflow: hidden;
      padding: 24px;
      color: var(--text);
      background:
        radial-gradient(circle at 20% 20%, rgba(0, 229, 255, 0.16), transparent 32%),
        radial-gradient(circle at 80% 75%, rgba(139, 92, 246, 0.2), transparent 34%),
        var(--background);
      font-family:
        Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont,
        "Segoe UI", sans-serif;
    }

    body::before {
      content: "";
      position: fixed;
      inset: 0;
      pointer-events: none;
      opacity: 0.35;
      background-image:
        linear-gradient(rgba(255,255,255,0.025) 1px, transparent 1px),
        linear-gradient(90deg, rgba(255,255,255,0.025) 1px, transparent 1px);
      background-size: 48px 48px;
      mask-image: radial-gradient(circle at center, black, transparent 75%);
    }

    .card {
      position: relative;
      width: min(100%, 720px);
      padding: clamp(40px, 8vw, 80px);
      overflow: hidden;
      text-align: center;
      border: 1px solid var(--border);
      border-radius: 28px;
      background: var(--surface);
      box-shadow:
        0 30px 100px rgba(0, 0, 0, 0.45),
        inset 0 1px 0 rgba(255, 255, 255, 0.08);
      backdrop-filter: blur(18px);
      -webkit-backdrop-filter: blur(18px);
    }

    .card::before {
      content: "";
      position: absolute;
      width: 280px;
      height: 280px;
      top: -180px;
      left: 50%;
      transform: translateX(-50%);
      border-radius: 50%;
      background: var(--cyan);
      filter: blur(100px);
      opacity: 0.18;
    }

    .badge {
      display: inline-flex;
      align-items: center;
      gap: 9px;
      margin-bottom: 24px;
      padding: 8px 14px;
      color: #d9fbff;
      font-size: 0.78rem;
      font-weight: 700;
      letter-spacing: 0.12em;
      text-transform: uppercase;
      border: 1px solid rgba(0, 229, 255, 0.25);
      border-radius: 999px;
      background: rgba(0, 229, 255, 0.08);
    }

    .dot {
      width: 8px;
      height: 8px;
      border-radius: 50%;
      background: var(--cyan);
      box-shadow: 0 0 16px var(--cyan);
      animation: pulse 2s infinite;
    }

    h1 {
      margin: 0;
      font-size: clamp(3.25rem, 11vw, 7rem);
      line-height: 0.92;
      letter-spacing: -0.07em;
    }

    .gradient-text {
      color: transparent;
      background: linear-gradient(120deg, #ffffff 15%, var(--cyan), var(--violet));
      background-clip: text;
      -webkit-background-clip: text;
    }

    p {
      max-width: 520px;
      margin: 26px auto 0;
      color: var(--muted);
      font-size: clamp(1rem, 2.5vw, 1.2rem);
      line-height: 1.7;
    }

    .divider {
      width: 72px;
      height: 3px;
      margin: 32px auto 0;
      border-radius: 999px;
      background: linear-gradient(90deg, var(--cyan), var(--violet));
      box-shadow: 0 0 24px rgba(0, 229, 255, 0.35);
    }

    footer {
      margin-top: 34px;
      color: rgba(255, 255, 255, 0.42);
      font-size: 0.8rem;
      letter-spacing: 0.08em;
      text-transform: uppercase;
    }

    @keyframes pulse {
      0%, 100% {
        transform: scale(1);
        opacity: 1;
      }

      50% {
        transform: scale(0.7);
        opacity: 0.45;
      }
    }

    @media (prefers-reduced-motion: reduce) {
      .dot {
        animation: none;
      }
    }
  </style>
</head>

<body>
  <main class="card">
    <div class="badge">
      <span class="dot"></span>
      Under Construction
    </div>

    <h1 class="gradient-text">Coming<br />Soon!</h1>

    <p>
      I'm building something new behind the scenes.
      Check back soon to see what’s next.
    </p>

    <div class="divider"></div>

    <footer>MattLivingston.com</footer>
  </main>
</body>
</html>
