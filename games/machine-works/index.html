<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover" />
  <title>Machine Works | Factory Automation Browser Game</title>
  <meta name="description" content="Play Machine Works, a static browser factory game about restoring abandoned production lines, routing resources, and rebuilding machines efficiently.">
  <link rel="canonical" href="https://mattlivingston.com/games/machine-works/">
  <meta property="og:type" content="website">
  <meta property="og:url" content="https://mattlivingston.com/games/machine-works/">
  <meta property="og:title" content="Machine Works | Factory Automation Browser Game">
  <meta property="og:description" content="Play Machine Works, a static browser factory game about restoring abandoned production lines, routing resources, and rebuilding machines efficiently.">
  <meta property="og:image" content="https://mattlivingston.com/games/img/machine-works.png">
  <meta property="og:image:alt" content="Machine Works | Factory Automation Browser Game preview image">

<meta name="twitter:card" content="summary_large_image">
  <meta name="twitter:url" content="https://mattlivingston.com/games/machine-works/">
  <meta name="twitter:title" content="Machine Works | Factory Automation Browser Game">
  <meta name="twitter:description" content="Play Machine Works, a static browser factory game about restoring abandoned production lines, routing resources, and rebuilding machines efficiently.">
  <meta name="twitter:image" content="https://mattlivingston.com/games/img/machine-works.png">
<meta name="theme-color" content="#15171a" />
  <link rel="manifest" href="manifest.json" />
  <link rel="icon" href="assets/icons/icon.svg" type="image/svg+xml" />
  <link rel="apple-touch-icon" href="assets/icons/icon.svg" />
  <link rel="stylesheet" href="assets/css/main.css" />
</head>
<body>
  <div id="app">
    <canvas id="game-canvas"></canvas>

    <header id="top-bar">
      <span id="factory-name">Loading…</span>
      <span id="milestone-badge">Factory Sandbox</span>
      <div class="top-bar-actions">
        <button id="btn-pause" class="icon-button" title="Pause simulation">&#10074;&#10074;</button>
        <button id="btn-speed" class="icon-button text-button" title="Simulation speed">1x</button>
        <button id="btn-zoom-out" class="icon-button" title="Zoom out">-</button>
        <button id="btn-zoom-in" class="icon-button" title="Zoom in">+</button>
        <button id="btn-center" class="icon-button" title="Center factory">&#9673;</button>
        <button id="btn-analysis" class="icon-button" title="Enter Analysis Mode">&#128202;</button>
        <button id="btn-blueprints" class="icon-button" title="Blueprints">&#128190;</button>
      </div>
    </header>

    <div id="hud-bar">
      <span id="power-readout" class="hud-pill">⚡ 0/0 kW</span>
      <span id="objective-readout" class="hud-pill objective-pill">Loading…</span>
      <span id="session-stats" class="hud-pill hidden"></span>
    </div>

    <aside id="inspector-panel" class="hidden" aria-live="polite">
      <div>
        <span id="inspector-title">Tile</span>
        <span id="inspector-detail">Empty</span>
      </div>
      <div class="inspector-actions">
        <button id="btn-inspector-rotate" title="Rotate selected">&#8635;</button>
        <button id="btn-inspector-delete" title="Remove selected">&times;</button>
      </div>
    </aside>

    <div id="toast-stack" aria-live="polite"></div>

    <div id="blueprint-panel" class="hidden">
      <div class="panel-header">
        <span>Blueprints</span>
        <button id="btn-close-blueprints" class="panel-close">&times;</button>
      </div>
      <div class="blueprint-save-row">
        <input id="blueprint-name-input" type="text" placeholder="Layout name" maxlength="40" />
        <button id="btn-save-blueprint">Save Current</button>
      </div>
      <div id="blueprint-list"></div>
    </div>

    <footer id="bottom-toolbar">
      <button data-tool="none" class="active"><span class="tool-icon">&#9673;</span><span>Select</span></button>
      <button data-tool="conveyor"><span class="tool-icon">&#8594;</span><span>Conveyor</span></button>
      <button data-tool="mining_drill"><span class="tool-icon">D</span><span>Drill</span></button>
      <button data-tool="smelter"><span class="tool-icon">F</span><span>Smelter</span></button>
      <button data-tool="coal_generator"><span class="tool-icon">P</span><span>Power</span></button>
      <button data-tool="storage_bin"><span class="tool-icon">B</span><span>Bin</span></button>
      <button data-tool="sink"><span class="tool-icon">S</span><span>Sink</span></button>
      <div class="toolbar-divider"></div>
      <button id="btn-rotate">Rotate &#8635;</button>
      <div class="toolbar-divider"></div>
      <button id="btn-undo" disabled>Undo</button>
      <button id="btn-redo" disabled>Redo</button>
    </footer>
  </div>

  <script>window.__MW_DISABLE_SW__ = new URLSearchParams(location.search).has('nosw');</script>
  <script type="module" src="src/game.js"></script>
</body>
</html>
