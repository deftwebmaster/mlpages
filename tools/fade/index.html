    <style>

<body>
    <header class="topbar" aria-label="FADE controls">
        <div class="brand">
            <span class="brand-mark" aria-hidden="true">FD</span>
            <span>
                <span class="brand-kicker">Flow-state drafting</span>
                <span class="brand-title">FADE Writer</span>
                <span class="brand-subtitle">Old paragraphs dim. The next sentence stays bright.</span>
            </span>
        </div>
        <div class="top-actions">
            <a class="home-link" href="/tools/">Tools</a>
            <button class="copy-btn" id="copyBtn" type="button">Copy</button>
            <button class="export-btn" id="exportBtn" type="button">Export</button>
            <button class="clear-btn" id="clearBtn" type="button">Clear</button>
            <label class="fade-control" for="fadeRange">
                <span>Fade</span>
                <input id="fadeRange" type="range" min="10" max="55" value="22" aria-label="Completed paragraph visibility">
            </label>
        </div>
    </header>

    <div class="hint" id="hint">Just write. Press Enter to move forward. Previous paragraphs fade so you do not keep rereading them.</div>
    
    <div class="container" id="container">
        <!-- Paragraphs will be created here -->
    </div>
    
    <div class="word-count" id="wordCount">0 words</div>
    <div class="save-indicator" id="saveIndicator">Saved</div>
    <div class="session-stats" aria-label="Draft stats">
        <span class="stat-pill"><strong id="statWords">0</strong> words</span>
        <span class="stat-pill"><strong id="statParagraphs">1</strong> paragraphs</span>
        <span class="stat-pill"><strong id="statMinutes">0</strong> min</span>
        <span class="stat-pill"><strong id="statSaved">Local</strong> draft</span>
    </div>
    
    <footer class="footer">
        <span>Built by <a href="https://mattlivingston.com" target="_blank" rel="noopener">Matt Livingston</a></span>
        <span class="separator">·</span>
        <span>Local draft. No uploads.</span>
    </footer>

    <script>
        const container = document.getElementById('container');
        const hint = document.getElementById('hint');
        const saveIndicator = document.getElementById('saveIndicator');
        const wordCountEl = document.getElementById('wordCount');
        const statWords = document.getElementById('statWords');
        const statParagraphs = document.getElementById('statParagraphs');
        const statMinutes = document.getElementById('statMinutes');
        const statSaved = document.getElementById('statSaved');
        const exportBtn = document.getElementById('exportBtn');
        const copyBtn = document.getElementById('copyBtn');
        const clearBtn = document.getElementById('clearBtn');
        const fadeRange = document.getElementById('fadeRange');
        
        const STORAGE_KEY = 'fade_draft';
        const FADE_KEY = 'fade_strength';
        let saveTimeout = null;
        let sessionStartedAt = Date.now();

        // Create a new paragraph element
        function createParagraph(text = '', isActive = true) {
            const p = document.createElement('div');
            p.className = 'paragraph' + (isActive ? ' active' : '');
            p.contentEditable = isActive;
            p.setAttribute('role', 'textbox');
            p.setAttribute('aria-label', isActive ? 'Active writing paragraph' : 'Completed paragraph');
            p.setAttribute('aria-multiline', 'true');
            p.classList.add('editor');
            p.textContent = text;
            
            if (isActive) {
                p.addEventListener('keydown', handleKeydown);
                p.addEventListener('input', handleInput);
            }
            
            return p;
        }

        // Handle Enter key - create new paragraph, fade current
        function handleKeydown(e) {
            if (e.key === 'Enter' && !e.shiftKey) {
                e.preventDefault();
                
                const currentParagraph = e.target;
                const text = currentParagraph.textContent.trim();
                
                // Only create new paragraph if current has content
                if (text.length > 0) {
                    // Fade current paragraph
                    currentParagraph.classList.remove('active');
                    currentParagraph.contentEditable = false;
                    currentParagraph.setAttribute('aria-label', 'Completed paragraph');
                    currentParagraph.removeEventListener('keydown', handleKeydown);
                    currentParagraph.removeEventListener('input', handleInput);
                    
                    // Create new active paragraph
                    const newParagraph = createParagraph('', true);
                    container.appendChild(newParagraph);
                    newParagraph.focus();
                    
                    // Save state
                    saveState();
                    updateStats();
                    
                    // Scroll to new paragraph
                    newParagraph.scrollIntoView({ behavior: 'smooth', block: 'center' });
                }
            }
        }

        // Handle input - auto-save and update word count
        function handleInput() {
            hideHint();
            debouncedSave();
            updateWordCount();
            updateStats();
        }

        // Hide the initial hint
        function hideHint() {
            hint.classList.add('hidden');
        }

        // Debounced save to localStorage
        function debouncedSave() {
            if (saveTimeout) clearTimeout(saveTimeout);
            saveTimeout = setTimeout(saveState, 1000);
        }

        // Save current state to localStorage
        function saveState() {
            const paragraphs = container.querySelectorAll('.paragraph');
            const hasText = Array.from(paragraphs).some(p => p.textContent.trim().length > 0);

            if (!hasText) {
                localStorage.removeItem(STORAGE_KEY);
                return;
            }

            const data = {
                paragraphs: Array.from(paragraphs).map(p => ({
                    text: p.textContent,
                    active: p.classList.contains('active')
                })),
                timestamp: Date.now()
            };
            
            localStorage.setItem(STORAGE_KEY, JSON.stringify(data));
            showSaveIndicator();
            updateSavedStatus('Saved');
        }

        // Show save indicator briefly
        function showSaveIndicator() {
            saveIndicator.classList.add('visible');
            updateSavedStatus('Saved');
            setTimeout(() => {
                saveIndicator.classList.remove('visible');
            }, 1500);
        }

        // Load state from localStorage
        function loadState() {
            const saved = localStorage.getItem(STORAGE_KEY);
            
            if (saved) {
                try {
                    const data = JSON.parse(saved);
                    
                    if (data.paragraphs && data.paragraphs.length > 0) {
                        hideHint();
                        
                        data.paragraphs.forEach((p, index) => {
                            const isLast = index === data.paragraphs.length - 1;
                            const paragraph = createParagraph(p.text, isLast);
                            container.appendChild(paragraph);
                        });
                        
                        // Focus the last (active) paragraph
                        const activeParagraph = container.querySelector('.paragraph.active');
                        if (activeParagraph) {
                            activeParagraph.focus();
                            // Move cursor to end
                            const range = document.createRange();
                            const sel = window.getSelection();
                            range.selectNodeContents(activeParagraph);
                            range.collapse(false);
                            sel.removeAllRanges();
                            sel.addRange(range);
                        }
                        
                        updateWordCount();
                        updateStats();
                        return;
                    }
                } catch (e) {
                    console.error('Failed to load saved state:', e);
                }
            }
            
            // No saved state - create initial paragraph
            initializeEmpty();
        }

        // Initialize with empty paragraph
        function initializeEmpty() {
            const firstParagraph = createParagraph('', true);
            container.appendChild(firstParagraph);
            firstParagraph.focus();
            updateStats();
        }

        // Update word count
        function updateWordCount() {
            const paragraphs = container.querySelectorAll('.paragraph');
            let totalWords = 0;
            
            paragraphs.forEach(p => {
                const text = p.textContent.trim();
                if (text) {
                    totalWords += text.split(/\s+/).filter(w => w.length > 0).length;
                }
            });
            
            wordCountEl.textContent = totalWords + (totalWords === 1 ? ' word' : ' words');
            statWords.textContent = totalWords;
            return totalWords;
        }

        function getDraftText() {
            const paragraphs = container.querySelectorAll('.paragraph');
            return Array.from(paragraphs)
                .map(p => p.textContent.trim())
                .filter(t => t.length > 0)
                .join('\n\n');
        }

        function updateStats() {
            const paragraphs = Array.from(container.querySelectorAll('.paragraph'));
            const filledParagraphs = paragraphs.filter(p => p.textContent.trim().length > 0).length;
            const paragraphCount = Math.max(1, filledParagraphs || paragraphs.length);
            const minutes = Math.max(0, Math.floor((Date.now() - sessionStartedAt) / 60000));

            statParagraphs.textContent = paragraphCount;
            statMinutes.textContent = minutes;
            updateWordCount();
        }

        function updateSavedStatus(text) {
            statSaved.textContent = text;
        }

        // Export as plain text
        function exportText() {
            const text = getDraftText();
            
            if (text.length === 0) {
                alert('Nothing to export yet. Start writing!');
                return;
            }
            
            // Create download
            const blob = new Blob([text], { type: 'text/plain' });
            const url = URL.createObjectURL(blob);
            const a = document.createElement('a');
            a.href = url;
            a.download = 'draft-' + new Date().toISOString().slice(0, 10) + '.txt';
            document.body.appendChild(a);
            a.click();
            document.body.removeChild(a);
            URL.revokeObjectURL(url);
        }

        async function copyText() {
            const text = getDraftText();

            if (text.length === 0) {
                alert('Nothing to copy yet. Start writing!');
                return;
            }

            try {
                await navigator.clipboard.writeText(text);
                saveIndicator.textContent = 'Copied';
                showSaveIndicator();
                updateSavedStatus('Copied');
                setTimeout(() => {
                    saveIndicator.textContent = 'Saved';
                    updateSavedStatus('Local');
                }, 1600);
            } catch (error) {
                alert('Copy failed. You can use Export instead.');
            }
        }

        // Clear all content
        function clearContent() {
            if (confirm('Clear everything? This cannot be undone.')) {
                localStorage.removeItem(STORAGE_KEY);
                container.innerHTML = '';
                hint.classList.remove('hidden');
                initializeEmpty();
                updateWordCount();
                updateStats();
                updateSavedStatus('Local');
            }
        }

        function restoreFadeStrength() {
            const savedFade = localStorage.getItem(FADE_KEY);
            if (savedFade) {
                fadeRange.value = savedFade;
            }
            applyFadeStrength(fadeRange.value);
        }

        function applyFadeStrength(value) {
            const opacity = Math.max(0.1, Math.min(0.55, Number(value) / 100));
            document.documentElement.style.setProperty('--fade-opacity', opacity);
            localStorage.setItem(FADE_KEY, String(value));
        }

        // Click anywhere to focus active paragraph
        document.body.addEventListener('click', (e) => {
            if (e.target === document.body || e.target === container) {
                const activeParagraph = container.querySelector('.paragraph.active');
                if (activeParagraph) {
                    activeParagraph.focus();
                }
            }
        });

        // Event listeners
        exportBtn.addEventListener('click', exportText);
        copyBtn.addEventListener('click', copyText);
        clearBtn.addEventListener('click', clearContent);
        fadeRange.addEventListener('input', (event) => {
            applyFadeStrength(event.target.value);
        });
        window.addEventListener('beforeunload', saveState);
        window.setInterval(updateStats, 30000);

        // Initialize
        restoreFadeStrength();
        loadState();
    </script>
</body>
</html>
